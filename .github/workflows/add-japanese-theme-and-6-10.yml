name: Add Japanese theme and 6-10 modes

on:
  push:
    paths:
      - '.github/workflows/add-japanese-theme-and-6-10.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Japanese theme and math modes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '.wall{position:absolute;background:#d9b77d;border:4px solid #956632;border-radius:11px;z-index:3}.bush{position:absolute;width:68px;height:50px;border-radius:50%;background:#45a33d;border:4px solid #2c7c31;box-shadow:-20px 7px 0 #55b84a,20px 7px 0 #55b84a;z-index:4}'
          new_css = '''.wall{position:absolute;background:linear-gradient(180deg,#29313d 0 28%,#a45a3a 28% 100%);border:4px solid #5e3427;border-radius:8px;z-index:3;box-shadow:0 5px 0 rgba(23,32,51,.16)}.wall::before{content:"";position:absolute;left:-7px;right:-7px;top:-10px;height:13px;background:#202630;border:3px solid #172033;border-radius:70% 70% 8px 8px}.bush{position:absolute;width:72px;height:58px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff1f7 0 7px,#ffb9d1 8px 18px,transparent 19px),radial-gradient(circle at 68% 26%,#ffe2ed 0 8px,#f99fbe 9px 20px,transparent 21px),radial-gradient(circle at 48% 65%,#ffd1e1 0 9px,#ef8caf 10px 22px,transparent 23px),#5ea84d;border:4px solid #437d3c;box-shadow:-17px 7px 0 #f4a2bf,18px 8px 0 #ffbfd4;z-index:4}.bush::before{content:"";position:absolute;width:10px;height:25px;left:27px;top:42px;background:#7b4a2b;border:2px solid #56311d;border-radius:4px;z-index:-1}.jpDecor{position:absolute;transform:translate(-50%,-50%);pointer-events:none;user-select:none;z-index:2;filter:drop-shadow(0 3px 1px rgba(23,32,51,.22))}.jpDecor.fuji{font-size:clamp(96px,10vw,150px);opacity:.27;z-index:1}.jpDecor.shrine{font-size:76px}.jpDecor.torii{font-size:72px}.jpDecor.lantern{font-size:44px}.jpDecor.sakura{font-size:58px}'''
          if old_css not in s:
              raise SystemExit('Could not find wall/bush CSS')
          s = s.replace(old_css, new_css, 1)

          s = s.replace('<div class="tag">Solve. Grab. Bank. Win.</div>', '<div class="tag">⛩️ Sakura Arena · Solve. Grab. Bank. Win. 🌸</div>', 1)
          s = s.replace('<h1>Name Your Character</h1>', '<h1>🥷 Name Your Ninja</h1>', 1)
          s = s.replace('<div>⭐ MATH STAR CHASE AND BANK</div>', '<div>⛩️ MATH STAR CHASE AND BANK 🌸</div>', 1)

          old_options = '<option value="mul5">Multiplication: ×2 to ×5 tables</option><option value="div5">Division: ÷2 to ÷5 tables</option><option value="mul10">Multiplication: ×2 to ×10 tables</option><option value="div10">Division: ÷2 to ÷10 tables</option>'
          new_options = '<option value="mul5">Multiplication: ×2 to ×5 tables</option><option value="div5">Division: ÷2 to ÷5 tables</option><option value="mul610">Multiplication: ×6 to ×10 tables</option><option value="div610">Division: ÷6 to ÷10 tables</option><option value="mul10">Multiplication: ×2 to ×10 tables</option><option value="div10">Division: ÷2 to ÷10 tables</option>'
          if old_options not in s:
              raise SystemExit('Could not find math select options')
          s = s.replace(old_options, new_options, 1)

          old_render = 'function renderMap(key){const p=mapProfiles[key]||mapProfiles.compact;if(world.dataset.mapKey===key)return;world.dataset.mapKey=key;world.style.width=p.w+"px";world.style.height=p.h+"px";world.querySelectorAll(".path,.base,.wall,.bush").forEach(el=>el.remove());let html=\'<div class="path p1"></div><div class="path p2"></div><div class="base blue">BLUE BASE</div><div class="base red">RED BASE</div>\';p.paths.forEach(a=>html+=\'<div class="path" style="\'+mapStyle(a)+\'"></div>\');p.walls.forEach(a=>html+=\'<div class="wall" style="\'+mapStyle(a)+\'"></div>\');p.bushes.forEach(a=>html+=\'<div class="bush" style="left:\'+a[0]+\'%;top:\'+a[1]+\'%"></div>\');world.insertAdjacentHTML("afterbegin",html)}'
          new_render = '''function renderMap(key){const p=mapProfiles[key]||mapProfiles.compact;if(world.dataset.mapKey===key)return;world.dataset.mapKey=key;world.style.width=p.w+"px";world.style.height=p.h+"px";world.querySelectorAll(".path,.base,.wall,.bush,.jpDecor").forEach(el=>el.remove());let html='<div class="jpDecor fuji" style="left:50%;top:9%">🗻</div><div class="jpDecor shrine" style="left:50%;top:20%">🏯</div><div class="jpDecor torii" style="left:10%;top:48%">⛩️</div><div class="jpDecor torii" style="left:90%;top:48%">⛩️</div><div class="jpDecor lantern" style="left:19%;top:39%">🏮</div><div class="jpDecor lantern" style="left:81%;top:61%">🏮</div><div class="jpDecor lantern" style="left:42%;top:79%">🏮</div><div class="jpDecor lantern" style="left:58%;top:32%">🏮</div><div class="jpDecor sakura" style="left:28%;top:16%">🌸</div><div class="jpDecor sakura" style="left:72%;top:84%">🌸</div><div class="jpDecor sakura" style="left:35%;top:82%">🌸</div><div class="jpDecor sakura" style="left:65%;top:15%">🌸</div><div class="path p1"></div><div class="path p2"></div><div class="base blue">BLUE BASE</div><div class="base red">RED BASE</div>';p.paths.forEach(a=>html+='<div class="path" style="'+mapStyle(a)+'"></div>');p.walls.forEach(a=>html+='<div class="wall" style="'+mapStyle(a)+'"></div>');p.bushes.forEach(a=>html+='<div class="bush" style="left:'+a[0]+'%;top:'+a[1]+'%"></div>');world.insertAdjacentHTML("afterbegin",html)}'''
          if old_render not in s:
              raise SystemExit('Could not find renderMap')
          s = s.replace(old_render, new_render, 1)

          old_names = 'const modeNames={add20:"Addition within 20",sub20:"Subtraction within 20",mul5:"Multiplication: ×2 to ×5 tables",div5:"Division: ÷2 to ÷5 tables",mul10:"Multiplication: ×2 to ×10 tables",div10:"Division: ÷2 to ÷10 tables",mul12:"Multiplication: ×2 to ×12 tables",div12:"Division: ÷2 to ÷12 tables",mixed:"Mixed: + − × ÷"};'
          new_names = 'const modeNames={add20:"Addition within 20",sub20:"Subtraction within 20",mul5:"Multiplication: ×2 to ×5 tables",div5:"Division: ÷2 to ÷5 tables",mul610:"Multiplication: ×6 to ×10 tables",div610:"Division: ÷6 to ÷10 tables",mul10:"Multiplication: ×2 to ×10 tables",div10:"Division: ÷2 to ÷10 tables",mul12:"Multiplication: ×2 to ×12 tables",div12:"Division: ÷2 to ÷12 tables",mixed:"Mixed: + − × ÷"};'
          if old_names not in s:
              raise SystemExit('Could not find modeNames')
          s = s.replace(old_names, new_names, 1)

          old_q = 'function makeQ(){let mode=mathMode;if(mode==="mixed")mode=["add20","sub20","mul12","div12"][rand(0,3)];let a,b,c,text,min=0,max=20;if(mode==="add20"){a=rand(0,20);b=rand(0,20-a);c=a+b;text=a+" + "+b}else if(mode==="sub20"){a=rand(0,20);b=rand(0,a);c=a-b;text=a+" − "+b}else if(mode==="mul5"||mode==="mul10"||mode==="mul12"){const top=mode==="mul5"?5:mode==="mul10"?10:12;a=rand(2,top);b=rand(1,12);c=a*b;text=a+" × "+b;min=1;max=top*12}else{const top=mode==="div5"?5:mode==="div10"?10:12;a=rand(2,top);c=rand(1,12);b=a*c;text=b+" ÷ "+a;min=1;max=12}return{text,correct:c,options:makeOptions(c,min,max)}}'
          new_q = 'function makeQ(){let mode=mathMode;if(mode==="mixed")mode=["add20","sub20","mul12","div12"][rand(0,3)];let a,b,c,text,min=0,max=20;if(mode==="add20"){a=rand(0,20);b=rand(0,20-a);c=a+b;text=a+" + "+b}else if(mode==="sub20"){a=rand(0,20);b=rand(0,a);c=a-b;text=a+" − "+b}else if(mode==="mul5"||mode==="mul610"||mode==="mul10"||mode==="mul12"){const low=mode==="mul610"?6:2,top=mode==="mul5"?5:mode==="mul610"?10:mode==="mul10"?10:12;a=rand(low,top);b=rand(1,12);c=a*b;text=a+" × "+b;min=1;max=top*12}else{const low=mode==="div610"?6:2,top=mode==="div5"?5:mode==="div610"?10:mode==="div10"?10:12;a=rand(low,top);c=rand(1,12);b=a*c;text=b+" ÷ "+a;min=1;max=12}return{text,correct:c,options:makeOptions(c,min,max)}}'
          if old_q not in s:
              raise SystemExit('Could not find makeQ')
          s = s.replace(old_q, new_q, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>(.*?)</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make Japanese arena theme prominent and add 6-10 modes"
          git push
