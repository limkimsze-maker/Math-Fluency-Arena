name: Build lightweight China emoji decorations

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update China map decorations
        run: python .github/scripts/china_emoji.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm China emoji decorations
        run: |
          grep -q 'CHINA_CNY_EMOJI_V1' index.html
          grep -q '🧧' index.html
          grep -q '🍊' index.html
          grep -q '🎆' index.html
          grep -q '🐉' index.html
          if grep 'if(theme==="china")return' index.html | grep -q '🏯'; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use lightweight festive emojis on China maps"
          git push
