name: Make banking clearer

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve banking clarity
        run: python .github/scripts/banking_clarity.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm banking clarity
        run: |
          grep -q 'BANKING_CLARITY_V1' index.html
          grep -q '🏦 BANK HERE' index.html
          grep -q '⭐⭐⭐ FULL! 🏦 BANK NOW' index.html
          grep -q '✅ BANKED' index.html
          grep -q 'function updateBankGuide' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make banking action clearer"
          git push
