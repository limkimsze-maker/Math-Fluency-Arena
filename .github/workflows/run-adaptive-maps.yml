name: Require ninja inside base to bank

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require ninja inside visible base
        run: python .github/scripts/bank_inside_base.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm strict base banking
        run: |
          grep -q 'BANK_INSIDE_BASE_V1' index.html
          grep -q 'fullyInsideOwnBase(x,y,team)' index.html
          grep -q 'fullyInsideOwnBase(bot.x,bot.y,bot.team)' index.html
          grep -q 'const home=baseCentre(bot.team)' index.html
          if grep -q 'x<w\*BASE' index.html; then exit 1; fi
          if grep -q 'bot.x<mapW()\*BASE' index.html; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Require ninja to be inside base before banking"
          git push
