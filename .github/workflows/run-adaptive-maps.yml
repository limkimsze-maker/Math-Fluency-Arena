name: Make grab immunity obvious

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve immunity feedback
        run: python .github/scripts/immunity_visual.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm immunity feedback
        run: |
          grep -q 'IMMUNITY_VISUAL_V1' index.html
          grep -q '🛡️ SAFE 2s' index.html
          grep -q 'SAFE 2s — RUN' index.html
          grep -q 'GRABBER_IMMUNITY_V1' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make 2-second grab immunity obvious"
          git push
