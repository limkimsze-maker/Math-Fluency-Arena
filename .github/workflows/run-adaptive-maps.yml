name: Browser bot demo update

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add browser-only bot demo
        run: python .github/scripts/bot_demo.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm bot demo markers
        run: |
          grep -q 'BOT_DEMO_V1' index.html
          grep -q 'Try the Game vs Bot' index.html
          grep -q 'OFFLINE BOT DEMO' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes needed"
          else
            git commit -m "Add browser-only Try vs Bot demo"
            git push
          fi
