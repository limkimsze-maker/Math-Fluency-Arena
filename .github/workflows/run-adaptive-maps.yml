name: Gameplay tuning for stars and bot

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune star distance and bot gameplay
        run: python .github/scripts/device_compatibility.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm gameplay tuning markers
        run: |
          grep -q 'GAMEPLAY_TUNING_V2' index.html
          grep -q 'function botPlanPath' index.html
          grep -q 'maxTravel=460' index.html
          grep -q 'id===BOT_ID?84:TAG' index.html
          grep -q 'botPointBlocked' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Improve star spacing and bot pathfinding"
          git push
