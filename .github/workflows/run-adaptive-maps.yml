name: Build 3v3 team bot demo

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 3v3 team bot challenge
        run: python .github/scripts/device_compatibility.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm 3v3 bot markers
        run: |
          grep -q 'MULTI_BOT_3V3_V1' index.html
          grep -q 'demo-blue-2' index.html
          grep -q 'demo-red-3' index.html
          grep -q 'function botDemoStep' index.html
          grep -q 'demoTarget.isBot' index.html
          grep -q 'p.isBot?84:TAG' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add 3v3 team bot challenge"
          git push
