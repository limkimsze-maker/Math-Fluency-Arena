name: Add identify fractions mode

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add identify fractions mode
        run: python .github/scripts/fraction_mode.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/star-game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm fraction mode
        run: |
          grep -q 'FRACTION_IDENTIFY_V1' index.html
          grep -q 'value="fraction">Identify Fractions' index.html
          grep -q 'function makeFractionQ' index.html
          grep -q 'function drawFractionVisual' index.html
          grep -q 'fractionCanvas' index.html
          grep -q 'SCARCE_SHARED_STARS_V1' index.html
          grep -q 'BOT_SETUP_OPTIONS_V1' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add identify fractions mode"
          git push
