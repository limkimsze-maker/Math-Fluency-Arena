name: Remove observer PIN access

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove guest observer PIN access
        run: python .github/scripts/remove_observer_pin.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm observer PIN removal
        run: |
          grep -q 'OBSERVER_PIN_REMOVED_V1' index.html
          grep -q 'id="observerSelect"' index.html
          grep -q '👁️ Live Observer' index.html
          if grep -q 'id="observerPinInput"' index.html; then exit 1; fi
          if grep -q 'id="joinObserver"' index.html; then exit 1; fi
          if grep -q 'id="hostObserverPin"' index.html; then exit 1; fi
          if grep -q 'Observer PIN' index.html; then exit 1; fi
          if grep -q 'async function joinObserver' index.html; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove guest observer PIN access"
          git push
