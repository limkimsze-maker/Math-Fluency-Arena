name: Host safety and everyone-left notice

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add host safety notice
        run: python .github/scripts/device_compatibility.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm host safety markers
        run: |
          grep -q 'HOST_SAFETY_V1' index.html
          grep -q 'All players have finished and left the live room' index.html
          grep -q 'safeToClose' index.html
          grep -q 'beforeunload' index.html
          grep -q 'LIVE HOST · Keep Open' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add host close warning and everyone-left notice"
          git push
