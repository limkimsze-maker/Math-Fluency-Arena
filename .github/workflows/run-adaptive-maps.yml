name: Add golden bank glow

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change ninja bank glow to gold
        run: python .github/scripts/bank_ninja_gold_glow.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm golden bank glow
        run: |
          grep -q 'BANK_NINJA_GLOW_V2' index.html
          grep -q 'bankGoldGlow' index.html
          grep -q 'bankNinjaGlow(playerId)' index.html
          grep -q 'bankNinjaGlow(bot.id)' index.html
          if grep -q 'bankBlueGlow' index.html; then exit 1; fi
          if grep -q 'bankRedGlow' index.html; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Change banking ninja glow to gold"
          git push
