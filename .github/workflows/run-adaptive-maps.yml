name: Build bot map and learning options

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add bot map and learning choices
        run: python .github/scripts/bot_setup.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm bot setup markers
        run: |
          grep -q 'BOT_SETUP_OPTIONS_V1' index.html
          grep -q 'id="botSetup"' index.html
          grep -q 'id="botMathModeSelect"' index.html
          grep -q 'id="botMapSizeSelect"' index.html
          grep -q 'id="botMapChoices"' index.html
          grep -q 'function renderBotMapChooser' index.html
          grep -q 'function openBotSetup' index.html
          grep -q 'mapKeyForSize(botSetupSize,botSetupTheme)' index.html
          grep -q 'tryBotBtn.addEventListener("click",openBotSetup)' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add bot map and learning choices"
          git push
