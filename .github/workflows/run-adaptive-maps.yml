name: Add shared central practice stars

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared central practice stars
        run: python .github/scripts/shared_star_practice.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm shared star practice
        run: |
          grep -q 'SHARED_STAR_PRACTICE_V1' index.html
          grep -q 'function sharedStarCountForPlayers' index.html
          grep -q 'n<=8?6:n<=16?8:n<=24?10:12' index.html
          grep -q 'function makeSharedStars' index.html
          grep -q 'function renderSharedStars' index.html
          grep -q 'sharedStars=makeSharedStars(sharedStarCountForPlayers(n))' index.html
          grep -q 'Math.hypot(x-s.x,y-s.y)<72' index.html
          grep -q 'Shared stars stay available so everyone gets practice.' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use shared central stars for easier practice"
          git push
