name: Rename map labels

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename map labels
        run: python .github/scripts/rename_map_labels.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/star-game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm renamed labels
        run: |
          grep -Fq 'Sakura Garden' index.html
          grep -Fq 'Singapore Garden City' index.html
          grep -Fq 'Chinese Lantern Garden' index.html
          ! grep -Fq 'Sakura Arena' index.html
          ! grep -Fq 'Singapore City Garden' index.html
          ! grep -Fq 'China Garden City' index.html
          grep -q 'SCARCE_SHARED_STARS_V1' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename map themes"
          git push
