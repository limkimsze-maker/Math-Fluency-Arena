name: Add live room capacity UI

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add public room capacity display
        run: python .github/scripts/room_capacity_ui.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm room capacity UI
        run: |
          grep -q 'ROOM_CAPACITY_UI_V1' index.html
          grep -q 'id="roomCapacity"' index.html
          grep -q 'id="createRoomBtn"' index.html
          grep -q '/api/room-capacity' index.html
          grep -q 'Creator Room is separately reserved' index.html
          grep -q 'createRoomBtn.addEventListener("click",createRoom)' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show live public room availability"
          git push
