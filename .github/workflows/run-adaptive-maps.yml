name: Add live observer questions

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add live selected-player question display
        run: python .github/scripts/observer_live_question.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm live observer questions
        run: |
          grep -q 'OBSERVER_LIVE_QUESTION_V1' index.html
          grep -q 'id="observerQuestion"' index.html
          grep -q 'type:"questionState"' index.html
          grep -q 'renderObserverQuestion' index.html
          grep -q '🧮 ' index.html
          grep -q 'Correct:' index.html
          grep -q 'Incorrect:' index.html
          if grep -q 'correct:liveQuestion' index.html; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show selected player live question to host"
          git push
