name: Add scarce shared stars

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make shared stars scarce
        run: python .github/scripts/scarce_shared_stars.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm scarce shared stars
        run: |
          grep -q 'SCARCE_SHARED_STARS_V1' index.html
          grep -q 'n<=8?2:n<=16?3:n<=24?4:5' index.html
          grep -q 'function makeReplacementSharedStar' index.html
          grep -q 'type:"starClaim"' index.html
          grep -q 'type:"starAwarded"' index.html
          grep -q 'function handleStarClaim' index.html
          grep -q 'function applyStarAward' index.html
          grep -q 'Math.hypot(x-s.x,y-s.y)<64' index.html
          grep -q 'A claimed star disappears for everyone' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make shared stars scarce and first-claim wins"
          git push
