name: Creator-only live hosting update

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hide public room creation
        run: python .github/scripts/device_compatibility.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm creator-only markers
        run: |
          grep -q 'Live class hosting is password protected.' index.html
          grep -q '🔒 Open Live Class Room' index.html
          if grep -q '<button id="create"' index.html; then
            echo 'Public create button still present'
            exit 1
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Hide live room creation behind creator password"
          git push
