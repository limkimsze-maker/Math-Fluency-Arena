name: Add Counter.dev tracker

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Counter.dev tracker
        run: python .github/scripts/add_counter_tracker.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/star-game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm tracker and game marker
        run: |
          grep -Fq '<script src="https://cdn.counter.dev/script.js" data-id="825e93b6-ce99-40ef-8bcc-125f13297433" data-utcoffset="8"></script>' index.html
          test "$(grep -Fo '825e93b6-ce99-40ef-8bcc-125f13297433' index.html | wc -l)" -eq 1
          grep -q 'SCARCE_SHARED_STARS_V1' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Counter.dev tracker"
          git push
