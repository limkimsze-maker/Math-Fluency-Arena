name: Add universal grabber immunity

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply grabber immunity rule
        run: python .github/scripts/grabber_immunity.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm universal grabber immunity
        run: |
          grep -q 'GRABBER_IMMUNITY_V1' index.html
          grep -q 'bot.immuneUntil=now+IMMUNE' index.html
          grep -q 'immuneUntil=Date.now()+IMMUNE;stats.stolen++' index.html
          if grep -q 'victim.carried--;victim.immuneUntil=now+IMMUNE' index.html; then exit 1; fi
          if grep -q 'demoTarget.carried--;demoTarget.immuneUntil=Date.now()+IMMUNE' index.html; then exit 1; fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Give successful grabbers 2 seconds of immunity"
          git push
