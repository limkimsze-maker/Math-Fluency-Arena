name: Fix banking pulse and burst

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix banking visuals
        run: python .github/scripts/banking_visual_fix.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm stronger banking visuals
        run: |
          grep -q 'BANKING_VISUAL_FIX_V2' index.html
          grep -q 'bankPulseStrong' index.html
          grep -q 'bankBurstStrong' index.html
          grep -q '✅ BANKED!' index.html
          grep -q 'bankBase.classList.remove("bankBurst"),1100' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix banking pulse and success burst"
          git push
