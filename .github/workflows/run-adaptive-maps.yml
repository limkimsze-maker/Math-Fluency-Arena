name: Add combined like fractions mode

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add combined like fractions mode
        run: python .github/scripts/like_fractions_mode.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not scripts: raise SystemExit('No inline script found')
          Path('/tmp/star-game.js').write_text(scripts[-1],encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm combined like fractions mode
        run: |
          grep -q 'LIKE_FRACTIONS_V1' index.html
          test "$(grep -o 'value="likefrac">Adding &amp; Subtracting Like Fractions' index.html | wc -l)" -eq 2
          grep -q 'likefrac:"Adding & Subtracting Like Fractions"' index.html
          grep -q 'function makeLikeFractionQ' index.html
          grep -q 'function makeLikeFractionOptions' index.html
          grep -q 'FRACTION_IDENTIFY_V1' index.html
          grep -q 'SCARCE_SHARED_STARS_V1' index.html
          grep -q 'BOT_SETUP_OPTIONS_V1' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add combined like fractions mode"
          git push
