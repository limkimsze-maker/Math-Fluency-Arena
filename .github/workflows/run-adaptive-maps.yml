name: Build 12 map choices and previews

on:
  push:
    paths:
      - '.github/workflows/run-adaptive-maps.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add 12 themed map layouts and previews
        run: python .github/scripts/device_compatibility.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/star-game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/star-game.js
      - name: Confirm 12-map chooser markers
        run: |
          grep -q 'MAP_CHOOSER_12_V1' index.html
          grep -q 'compact_sg' index.html
          grep -q 'compact_cn' index.html
          grep -q 'mega_sg' index.html
          grep -q 'mega_cn' index.html
          grep -q 'Singapore City Garden' index.html
          grep -q 'China Garden City' index.html
          grep -q 'id="mapChoices"' index.html
          grep -q 'function renderMiniMap' index.html
          grep -q 'function renderMapChooser' index.html
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add 12 map layouts and lobby previews"
          git push
