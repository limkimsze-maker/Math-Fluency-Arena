name: Rename game to Math Star Chase and Bank

on:
  push:
    paths:
      - '.github/workflows/rename-math-star-chase-and-bank.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Star Grab</title>', '<title>Math Star Chase and Bank</title>')
          s = s.replace('⭐ Star Grab', '⭐ Math Star Chase and Bank')
          s = s.replace('⭐ STAR GRAB', '⭐ MATH STAR CHASE AND BANK')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit rename
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rename game to Math Star Chase and Bank"
          git push
