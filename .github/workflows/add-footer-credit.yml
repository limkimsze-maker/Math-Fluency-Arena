name: Add footer credit

on:
  push:
    paths:
      - '.github/workflows/add-footer-credit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add footer credit
        run: python .github/scripts/add_credit.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script>\s*(.*?)\s*</script>',s,re.S)
          if not m: raise SystemExit('No script found')
          Path('/tmp/game.js').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/game.js
      - name: Commit update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add Lim Kim Sze footer credit"
          git push
