name: Fix adaptive map workflow

on:
  push:
    paths:
      - '.github/workflows/fix-adaptive-trigger.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix Python shell and retrigger
        run: |
          sed -i 's/shell: python$/shell: python {0}/' .github/workflows/adaptive-player-maps.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/adaptive-player-maps.yml
          git commit -m "Fix adaptive map workflow shell"
          git push
